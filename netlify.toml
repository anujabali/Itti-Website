# Build settings live here rather than in the dashboard, so they are reviewable,
# survive someone rebuilding the site connection, and change through a pull
# request like everything else.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Deploy previews get a URL per pull request, which is the point of connecting
# the repository rather than uploading a folder.
[context.deploy-preview]
  command = "npm run build"

# Fingerprinted assets can be cached forever — the filename changes when the
# contents do.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The plates and brand assets are not fingerprinted, so cache them hard but
# allow revalidation. They are the bulk of the page weight.
[[headers]]
  for = "/plates/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/shop/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
